services:
  # Backend Web Service
  - type: web
    name: ai-employee-analytics-api
    env: node
    region: oregon
    plan: free
    buildCommand: "cd server && npm install"
    startCommand: "cd server && npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false # Set this manually in Render Dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false # Set this manually in Render Dashboard
      - key: FRONTEND_URL
        value: "https://ai-employee-analytics.onrender.com" # Change this after frontend is deployed

  # Frontend Static Site
  - type: web
    name: ai-employee-analytics-client
    env: static
    region: oregon
    plan: free
    buildCommand: "cd client && npm install && npm run build"
    staticPublishPath: "./client/dist"
    envVars:
      - key: VITE_API_URL
        value: "https://ai-employee-analytics-api.onrender.com" # Change this after backend is deployed
